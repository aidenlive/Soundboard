# XcodeGen spec for the Routing Lab app (iOS + macOS).
#   brew install xcodegen && cd platforms/apple && xcodegen && open RoutingLab.xcodeproj
name: RoutingLab
options:
  bundleIdPrefix: com.soundboard
  deploymentTarget:
    iOS: "17.0"
    macOS: "14.0"
packages:
  Soundboard:
    path: ../..
targets:
  RoutingLab:
    type: application
    supportedDestinations: [iOS, macOS]
    sources: [RoutingLab]
    dependencies:
      - package: Soundboard
        product: SoundboardAudio
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.soundboard.routinglab
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UIBackgroundModes: audio
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: "UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        ENABLE_APP_SANDBOX: YES
        SWIFT_VERSION: "5.9"
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
