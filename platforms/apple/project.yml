# XcodeGen spec for the Apple apps (iOS + macOS).
#   brew install xcodegen && cd platforms/apple && xcodegen && open Soundboard.xcodeproj
name: Soundboard
options:
  bundleIdPrefix: com.soundboard
  deploymentTarget:
    iOS: "17.0"
    macOS: "14.0"
packages:
  Soundboard:
    path: ../..
settingGroups:
  common:
    GENERATE_INFOPLIST_FILE: YES
    ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    INFOPLIST_KEY_UILaunchScreen_Generation: YES
    INFOPLIST_KEY_UISupportedInterfaceOrientations: "UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
    INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
    INFOPLIST_KEY_UIRequiresFullScreen: YES
    "CODE_SIGN_ENTITLEMENTS[sdk=macosx*]": Shared/Soundboard-macOS.entitlements
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.2.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  Soundboard:
    type: application
    supportedDestinations: [iOS, macOS]
    sources:
      - App
      - path: Shared
        excludes: ["*.entitlements"]
    info:
      path: App/Info.plist
      properties:
        UIBackgroundModes: [audio]
        LSApplicationCategoryType: public.app-category.music
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        # Black, empty launch screen: the app's own launch sequence shows the mark, so nothing
        # appears twice and there is no white flash before the OLED theme.
        UILaunchScreen:
          UIColorName: LaunchBackground
    dependencies:
      - package: Soundboard
        product: SoundboardUI
    settings:
      groups: [common]
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.soundboard.app
        INFOPLIST_KEY_CFBundleDisplayName: Soundboard
        # The Info.plist's UILaunchScreen (black) must not be replaced by a generated one.
        INFOPLIST_KEY_UILaunchScreen_Generation: NO
  RoutingLab:
    type: application
    supportedDestinations: [iOS, macOS]
    sources:
      - RoutingLab
      - path: Shared
        excludes: ["*.entitlements"]
    info:
      path: RoutingLab/Info.plist
      properties:
        UIBackgroundModes: [audio]
    dependencies:
      - package: Soundboard
        product: SoundboardAudio
    settings:
      groups: [common]
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.soundboard.routinglab
